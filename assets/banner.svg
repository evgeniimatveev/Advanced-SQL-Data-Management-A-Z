<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Advanced SQL and Data Management A-Z banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08192b"/>
      <stop offset="0.6" stop-color="#0f3250"/>
      <stop offset="1" stop-color="#14606f"/>
    </linearGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <!-- decorative ER diagram: three tables linked by foreign keys -->
  <g transform="translate(860 36)" font-family="Consolas, 'Courier New', monospace" font-size="15">
    <path d="M118 78 H170 V120 H215" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M118 150 H150 V210 H215" fill="none" stroke="#00d0f0" stroke-width="3" stroke-linejoin="round"/>
    <g>
      <rect x="0" y="40" width="118" height="140" rx="8" fill="url(#tbl)" stroke="#ffffff" stroke-opacity="0.4"/>
      <rect x="0" y="40" width="118" height="28" rx="8" fill="#00a7c4"/><text x="59" y="60" text-anchor="middle" fill="#ffffff" font-weight="700">customers</text>
      <text x="12" y="92" fill="#ffb84d">PK</text><text x="40" y="92" fill="#e8f4fb">id</text>
      <text x="12" y="116" fill="#e8f4fb">name</text><text x="12" y="140" fill="#e8f4fb">country</text><text x="12" y="164" fill="#e8f4fb">credit</text>
    </g>
    <g>
      <rect x="215" y="76" width="118" height="116" rx="8" fill="url(#tbl)" stroke="#ffffff" stroke-opacity="0.4"/>
      <rect x="215" y="76" width="118" height="28" rx="8" fill="#ff9f1c"/><text x="274" y="96" text-anchor="middle" fill="#08192b" font-weight="700">orders</text>
      <text x="227" y="128" fill="#ffb84d">PK</text><text x="255" y="128" fill="#e8f4fb">no</text>
      <text x="227" y="152" fill="#00d0f0">FK</text><text x="255" y="152" fill="#e8f4fb">cust_id</text><text x="227" y="176" fill="#e8f4fb">date</text>
    </g>
    <g>
      <rect x="215" y="206" width="118" height="68" rx="8" fill="url(#tbl)" stroke="#ffffff" stroke-opacity="0.4"/>
      <rect x="215" y="206" width="118" height="26" rx="8" fill="#8ecae6"/><text x="274" y="225" text-anchor="middle" fill="#08192b" font-weight="700">payments</text>
      <text x="227" y="254" fill="#00d0f0">FK</text><text x="255" y="254" fill="#e8f4fb">cust_id</text>
    </g>
  </g>
  <!-- title -->
  <text x="64" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ff9f1c" letter-spacing="6">MYSQL 8.0 · WORKBOOK</text>
  <text x="62" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff">Advanced SQL</text>
  <text x="64" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#cfe9f7">&amp; Data Management A–Z</text>
  <text x="64" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9cc3d9">Window functions · CTEs · Stored procedures · Normalization</text>
</svg>
